<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website!!!</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="questionnaire">
  <div class="outer-box">
    <form id="profile-form">

      <label>Sign:
        <select name="sign" required>
          <option value="" disabled selected>choose your sign</option>
          <option>aquarius</option><option>pisces</option><option>aries</option>
          <option>taurus</option><option>gemini</option><option>cancer</option>
          <option>leo</option><option>virgo</option><option>libra</option>
          <option>scorpio</option><option>sagittarius</option><option>capricorn</option>
        </select>
      </label>

      <label>Age: <input type="text" name="age" required></label>
      <label>Activity: <input type="text" name="activity" required></label>
      <label>Gender: <input type="text" name="gender" required></label>
      <label>Favorite color: <input type="text" name="favoriteColor" required></label>
      <label>Favorite food: <input type="text" name="favoriteFood" required></label>
      <label>Love Language: <input type="text" name="loveLanguage" required></label>
      <label>Communication style: <input type="text" name="communicationStyle" required></label>
      <label>Qualities: <textarea name="qualities" rows="2" required></textarea></label>
      <label>Flaws: <textarea name="flaws" rows="2" required></textarea></label>
      <label>Physical attributes: <textarea name="physical" rows="2" required></textarea></label>

      <button type="submit" class="submit-button">Submit</button>
      <p id="confirmation"></p>
    </form>
  </div>
</div>

<a href="http://127.0.0.1:5501/index.html" class="play-button">Play</a>

<video class="videobg" autoplay muted loop id="myVideo">
  <source src="bg_video.mp4" type="video/mp4">
</video>

<script>
	const form = document.getElementById("profile-form");
  
	if (!form) {
	  alert("Form not found: the <form> tag needs id=\"profile-form\"");
	} else {
	  form.addEventListener("submit", function (event) {
		event.preventDefault();
  
		const data = Object.fromEntries(new FormData(form));
  
		let submissions = [];
		try {
		  submissions = JSON.parse(localStorage.getItem("submissions")) || [];
		} catch (e) {}
  
		submissions.push(data);
		localStorage.setItem("submissions", JSON.stringify(submissions));
  
		form.reset();
		document.getElementById("confirmation").textContent = "Thanks, your profile was added!";
	  });
	}
  </script>
</body>
<!-- in template.html -->
<a href="index.html" class="play-button"> play </a>
</html>
